plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.fanvod.tts'
    compileSdk 34

    defaultConfig {
        applicationId "pl.fanvod.tts"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
